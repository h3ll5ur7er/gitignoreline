[project]
name = "gitignoreline"
version = "0.1.0"
description = "Line-level git ignore: strip marked lines and blocks before they enter the repository."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
]

[project.scripts]
gitignoreline = "gitignoreline.cli:main"
gitignoreline-clean = "gitignoreline.filter:clean_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitignoreline"]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
